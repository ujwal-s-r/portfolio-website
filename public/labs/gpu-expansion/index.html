<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU Architecture & Tensor Core Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #e0a03c;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .hud-subtitle {
      font-size: 11px;
      color: #9a9a9a;
    }
    .stats-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #232323;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 11px;
      pointer-events: auto;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 6px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #888888;
    }
    .stat-val {
      color: #f0f0f0;
      font-weight: 600;
    }
    .controls-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #232323;
      padding: 8px 14px;
      border-radius: 24px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .btn {
      background: #191919;
      border: 1px solid #2e2e2e;
      color: #d1d1d1;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #252525;
      color: #ffffff;
      border-color: #e0a03c;
    }
    .btn.active {
      background: rgba(224, 160, 60, 0.18);
      border-color: #e0a03c;
      color: #e0a03c;
    }
    .info-tooltip {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #777777;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <div class="hud-title"><span class="live-dot"></span> NVIDIA H100 SM Architecture Simulation</div>
    <div class="hud-subtitle">Interactive 3D Hardware & Warp Dispatch Visualizer</div>
  </div>

  <div class="stats-panel">
    <div class="stat-row">
      <span class="stat-label">SM Cores:</span>
      <span class="stat-val" id="val-cores">128 SMs (Active)</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Tensor Cores (4th Gen):</span>
      <span class="stat-val" id="val-tensor">512 Units</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">SRAM / Shared Mem:</span>
      <span class="stat-val">228 KB / SM</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">HBM3 Bandwidth:</span>
      <span class="stat-val" style="color: #e0a03c;">3.35 TB/s</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Warp Occupancy:</span>
      <span class="stat-val" id="val-occupancy">96.8%</span>
    </div>
  </div>

  <div class="info-tooltip">Click & Drag to Rotate • Scroll to Zoom • Right Click to Pan</div>

  <div class="controls-panel">
    <button class="btn active" id="btn-flow" onclick="toggleDataFlow()">
      <span>⚡</span> Animate Data Flow
    </button>
    <button class="btn" id="btn-cores" onclick="toggleTensorHighlight()">
      <span>💎</span> Highlight Tensor Cores
    </button>
    <button class="btn" onclick="resetView()">
      <span>↺</span> Reset View
    </button>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let smGroup, particles, tensorCoreMeshes = [];
    let isFlowing = true, isHighlighted = false;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0a);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(22, 18, 26);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 80;
      controls.minDistance = 6;

      // Lights
      const ambientLight = new THREE.AmbientLight(0x222222, 1.5);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight1.position.set(20, 40, 20);
      scene.add(dirLight1);

      const amberAccentLight = new THREE.PointLight(0xe0a03c, 2.5, 50);
      amberAccentLight.position.set(-10, 15, -10);
      scene.add(amberAccentLight);

      const blueSubLight = new THREE.PointLight(0x3b82f6, 1.8, 50);
      blueSubLight.position.set(15, -5, 15);
      scene.add(blueSubLight);

      // Grid helper floor
      const grid = new THREE.GridHelper(50, 50, 0x232323, 0x141414);
      grid.position.y = -4;
      scene.add(grid);

      buildGPUArchitecture();
      buildDataFlowParticles();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildGPUArchitecture() {
      smGroup = new THREE.Group();

      // Main GPU Die Substrate
      const baseGeo = new THREE.BoxGeometry(22, 1, 18);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x141414,
        roughness: 0.6,
        metalness: 0.8,
      });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.y = -1;
      smGroup.add(baseMesh);

      // 4 SM Quadrants
      const quadOffsets = [
        [-5.5, 0, -4.5],
        [5.5, 0, -4.5],
        [-5.5, 0, 4.5],
        [5.5, 0, 4.5]
      ];

      quadOffsets.forEach((offset, qIdx) => {
        const quadrant = new THREE.Group();
        quadrant.position.set(offset[0], offset[1], offset[2]);

        // Sub-SM Board
        const subGeo = new THREE.BoxGeometry(9.5, 0.6, 7.5);
        const subMat = new THREE.MeshStandardMaterial({
          color: 0x1a1a1a,
          roughness: 0.7,
          metalness: 0.5
        });
        const subMesh = new THREE.Mesh(subGeo, subMat);
        quadrant.add(subMesh);

        // Shared Memory / L1 Data Cache Module
        const sramGeo = new THREE.BoxGeometry(8.5, 0.4, 1.4);
        const sramMat = new THREE.MeshStandardMaterial({
          color: 0x282828,
          roughness: 0.4,
          metalness: 0.7
        });
        const sramMesh = new THREE.Mesh(sramGeo, sramMat);
        sramMesh.position.set(0, 0.5, -2.4);
        quadrant.add(sramMesh);

        // 4 Processing Blocks per SM Quadrant (Tensor Core Sub-partitions)
        for (let bx = 0; bx < 2; bx++) {
          for (let bz = 0; bz < 2; bz++) {
            const blockGroup = new THREE.Group();
            blockGroup.position.set((bx - 0.5) * 4.2, 0.4, (bz - 0.5) * 2.4 + 0.6);

            // Warp Scheduler
            const warpGeo = new THREE.BoxGeometry(3.6, 0.3, 0.6);
            const warpMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const warpMesh = new THREE.Mesh(warpGeo, warpMat);
            warpMesh.position.set(0, 0.1, -0.6);
            blockGroup.add(warpMesh);

            // Tensor Core Matrix Multiply Unit
            const tcGeo = new THREE.BoxGeometry(1.5, 0.5, 1.1);
            const tcMat = new THREE.MeshStandardMaterial({
              color: 0x333333,
              roughness: 0.3,
              metalness: 0.9
            });
            const tcMesh = new THREE.Mesh(tcGeo, tcMat);
            tcMesh.position.set(-0.9, 0.25, 0.4);
            blockGroup.add(tcMesh);
            tensorCoreMeshes.push(tcMesh);

            // FP32 / INT32 CUDA Cores
            const cudaGeo = new THREE.BoxGeometry(1.5, 0.35, 1.1);
            const cudaMat = new THREE.MeshStandardMaterial({
              color: 0x262626,
              roughness: 0.5,
              metalness: 0.7
            });
            const cudaMesh = new THREE.Mesh(cudaGeo, cudaMat);
            cudaMesh.position.set(0.9, 0.18, 0.4);
            blockGroup.add(cudaMesh);

            quadrant.add(blockGroup);
          }
        }

        smGroup.add(quadrant);
      });

      // L2 Cache Central Crossbar
      const l2Geo = new THREE.BoxGeometry(20, 0.8, 1.2);
      const l2Mat = new THREE.MeshStandardMaterial({
        color: 0x242424,
        roughness: 0.5,
        metalness: 0.8
      });
      const l2Mesh = new THREE.Mesh(l2Geo, l2Mat);
      l2Mesh.position.set(0, 0.1, 0);
      smGroup.add(l2Mesh);

      scene.add(smGroup);
    }

    function buildDataFlowParticles() {
      const particleCount = 280;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 18;
        positions[i * 3 + 1] = Math.random() * 2 + 0.2;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 14;

        velocities.push({
          x: (Math.random() - 0.5) * 0.08,
          z: (Math.random() - 0.5) * 0.08,
          phase: Math.random() * Math.PI * 2
        });
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xe0a03c,
        size: 0.35,
        transparent: true,
        opacity: 0.85
      });

      particles = new THREE.Points(geometry, material);
      particles.userData = { velocities };
      scene.add(particles);
    }

    function toggleDataFlow() {
      isFlowing = !isFlowing;
      const btn = document.getElementById('btn-flow');
      btn.classList.toggle('active', isFlowing);
      particles.visible = isFlowing;
    }

    function toggleTensorHighlight() {
      isHighlighted = !isHighlighted;
      const btn = document.getElementById('btn-cores');
      btn.classList.toggle('active', isHighlighted);

      tensorCoreMeshes.forEach(mesh => {
        if (isHighlighted) {
          mesh.material.color.setHex(0xe0a03c);
          mesh.material.emissive.setHex(0x5c3d0e);
        } else {
          mesh.material.color.setHex(0x333333);
          mesh.material.emissive.setHex(0x000000);
        }
      });
    }

    function resetView() {
      controls.reset();
      camera.position.set(22, 18, 26);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = 0;
    function animate() {
      requestAnimationFrame(animate);
      clock += 0.015;

      controls.update();

      if (isFlowing && particles) {
        const positions = particles.geometry.attributes.position.array;
        const vels = particles.userData.velocities;

        for (let i = 0; i < vels.length; i++) {
          positions[i * 3] += vels[i].x;
          positions[i * 3 + 2] += vels[i].z;
          positions[i * 3 + 1] = 0.6 + Math.sin(clock * 2 + vels[i].phase) * 0.3;

          if (Math.abs(positions[i * 3]) > 9.5) positions[i * 3] = -positions[i * 3] * 0.9;
          if (Math.abs(positions[i * 3 + 2]) > 7.5) positions[i * 3 + 2] = -positions[i * 3 + 2] * 0.9;
        }
        particles.geometry.attributes.position.needsUpdate = true;
      }

      // Gentle hardware floating tilt
      if (smGroup) {
        smGroup.rotation.y = Math.sin(clock * 0.2) * 0.04;
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
